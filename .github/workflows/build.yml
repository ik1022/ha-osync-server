name: Build and smoke test
on:
  workflow_dispatch:
  push:
    paths: ["osync/**", "tests/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["osync/**", "tests/**", ".github/workflows/build.yml"]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t osync-ha:test osync
      - name: Startup and persistence smoke test
        run: python3 tests/smoke.py osync-ha:test
