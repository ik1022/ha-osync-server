name: Osync All-in-One
version: "0.1.0"
slug: osync
url: https://github.com/ik1022/ha-osync-server
description: Osync sync server with PostgreSQL and MinIO
arch:
  - amd64
  - aarch64
stage: experimental
startup: application
boot: auto
init: true
timeout: 120
backup: cold
webui: http://[HOST]:[PORT:3000]/admin/
watchdog: http://[HOST]:[PORT:3000]/health
ports:
  3000/tcp: 3000
  9000/tcp: 9000
ports_description:
  3000/tcp: Osync API and web UI (reverse proxy upstream)
  9000/tcp: S3 API (reverse proxy upstream)
options:
  public_url: ""
  s3_public_endpoint: ""
  language: ko
  admin_email: ""
  admin_password: ""
schema:
  public_url: str
  s3_public_endpoint: str
  language: list(ko|en)
  admin_email: str
  admin_password: password
